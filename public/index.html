<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no" />
  <title>Fabric → Azure Maps — multi-source demo</title>
  <link rel="stylesheet" href="https://atlas.microsoft.com/sdk/javascript/mapcontrol/3/atlas.min.css" type="text/css" />
  <script src="https://atlas.microsoft.com/sdk/javascript/mapcontrol/3/atlas.min.js"></script>
  <link rel="stylesheet" href="./styles.css" type="text/css" />
</head>
<body>
  <header id="topbar">
    <div class="brand">Fabric → Azure Maps</div>
    <div class="controls">
      <label class="ctl">
        <span class="ctl-label">Source</span>
        <select id="source-select" title="Data source"></select>
      </label>
      <label class="ctl">
        <span class="ctl-label">Method</span>
        <select id="method-select" title="Retrieval method"></select>
      </label>

      <span id="rt-group" class="rt-group hidden">
        <label class="ctl rt-toggle">
          <span class="ctl-label">Real-time</span>
          <input type="checkbox" id="rt-toggle" />
        </label>
        <label class="ctl">
          <span class="ctl-label">Refresh</span>
          <select id="rt-interval" disabled>
            <option value="5000" selected>5 seconds</option>
            <option value="10000">10 seconds</option>
            <option value="30000">30 seconds</option>
            <option value="60000">1 minute</option>
            <option value="300000">5 minutes</option>
          </select>
        </label>
      </span>

      <span id="status-pill" class="pill">…</span>
      <button id="reload" title="Reload data">Load</button>
    </div>
  </header>
  <div id="map"></div>
  <div id="status" class="status"></div>
  <script src="./app.js"></script>
  <script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
  <script src="./render-pmtiles.js"></script>
</body>
</html>
